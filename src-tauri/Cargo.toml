[package]
name = "paper-wasp"
version = "0.1.0"
description = "A PDF reader that doesn't trust the document."
edition = "2021"
rust-version = "1.85"

[lib]
name = "paper_wasp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hayro = { version = "0.8", features = ["embed-fonts"] }
hayro-interpret = "0.8"
lopdf = "0.45"
sha2 = "0.11"
log = "0.4"
env_logger = "0.11"
png = "0.18"
memchr = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
