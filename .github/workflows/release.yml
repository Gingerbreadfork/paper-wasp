name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - name: Tag matches the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,rpm,appimage
      - name: Collect
        run: |
          mkdir -p release
          for f in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "release/$(basename "$f" | tr ' ' '-')"
          done
          cd release && sha256sum * > SHA256SUMS-linux && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: paper-wasp-linux
          path: release/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Paper Wasp ${GITHUB_REF_NAME#v}" --draft --generate-notes 2>/dev/null || true
          for f in release/*; do
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$f"
          done

  windows:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - name: Collect
        run: |
          mkdir -p release
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "release/$(basename "$f" | tr ' ' '-')"
          done
          cd release && sha256sum * | sed 's/ \*/  /' > SHA256SUMS-windows && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: paper-wasp-windows
          path: release/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Paper Wasp ${GITHUB_REF_NAME#v}" --draft --generate-notes 2>/dev/null || true
          for f in release/*; do
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$f"
          done
